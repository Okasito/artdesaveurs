<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réservation - L'art des saveurs</title>

    <link href="resto.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

    <style>
        main {
            padding-top: 120px;
        }
    </style>
</head>

<body>
<header>
    <div class="header-container" id="headerMerci">
        <a href="index.html" class="header-link">
            <img src="logo-header-gauche.png" class="logo">
            <h1>L'art des saveurs</h1>
        </a>
    </div>
</header>
<main>
    <section id="reservation">
        <h2>Réservation</h2>

        <form action="https://formspree.io/f/xljelenz" method="POST" class="form-reservation">
            <div class="form-group">
                <label for="nom">Nom</label>
                <input type="text" id="nom" name="nom" required>
            </div>

            <div class="form-group">
                <label for="telephone">Téléphone</label>
                <input type="tel" id="telephone" name="telephone" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" required>
                </div>

                <div class="form-group">
                    <label for="heure">Heure</label>
                    <input type="time" id="heure" name="heure" required>
                </div>
            </div>

            <div class="form-group">
                <label for="personnes">Nombre de personnes</label>
                <input type="number" id="personnes" name="personnes" min="1" required>
            </div>

            <div class="form-group">
                <label for="message">Une demande particulière ?</label>
                <textarea id="message" name="message" rows="4" placeholder="Allergies, occasion spéciale..."></textarea>
            </div>

            <button type="submit">Réserver</button>
        </form>
    </section>
</main>

</body>
</html>
