<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <title>Restaurant page</title>

    <link href="resto.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
</head>

<body>

<header>
    <div class="header-container">

        <img src="logo-header-gauche.png" class="logo">

        <h1>L'art des saveurs</h1>

        <div class="menu-btn" id="menuBtn">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </div>
</header>

<!-- MENU -->
<nav class="side-menu" id="sideMenu">
    <a href="#menu">Menu</a>
    <a href="#reservation">Réservation</a>
    <a href="#contact">Contact</a>
    <a href="#location">Nous trouver</a>
</nav>

<!-- HERO -->
<section class="hero">
    <h2>Bienvenue</h2>
</section>

<main>

    <section id="menu">
        <h2>Menu</h2>
        <p>Crêpes salées et sucrées maison</p>
    </section>

    <section id="reservation">
        <h2>Réservation</h2>

<form action="https://formspree.io/f/xljelenz" method="POST">                                     <!--module mail réservation-->
    <input type="text" name="nom" placeholder="Nom" required>
    <input type="tel" name="telephone" placeholder="Votre numéro de téléphone" required>
    <input type="date" name="date" required>
    <input type="time" name="heure" required>
    <input type="number" name="personnes" placeholder="Nombre de personnes" min="1" required>
    <textarea name="message" placeholder="Une demande particulière ? (allergies, occasion spéciale...)" rows="4"></textarea>
    <button type="submit">Réserver</button>
</form>
        </form>
    </section>

    <section id="contact">
        <h2>Contact</h2>
        <p>01 23 45 67 89</p>
    </section>

    <section id="location">
        <h2>Nous trouver</h2>

        <iframe
            src="https://www.google.com/maps/embed?pb=!1m18..."
            height="300">
        </iframe>

    </section>

</main>

<script>
const menuBtn = document.getElementById("menuBtn");
const sideMenu = document.getElementById("sideMenu");

menuBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    menuBtn.classList.toggle("active");
    sideMenu.classList.toggle("active");
});

document.addEventListener("click", (e) => {
    if (!sideMenu.contains(e.target) && !menuBtn.contains(e.target)) {
        menuBtn.classList.remove("active");
        sideMenu.classList.remove("active");
    }
});
</script>

</body>
</html>
